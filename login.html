<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body{
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, orange, blue)
        }
        form{
            width: 800px;
            height: 500px;
            background: white;
            display: flex;
            border-radius: 10px;
            overflow: hidden;
        }
        .why{
           flex: 1;
           padding: 30px;
        }
        h1{
            text-align: center;
            font-family: Verdana;
            margin-top: 70px;
        }
        input{
            width: 350px;
            padding: 10px;
            border-radius: 5px;
        }
        button{
            background: orange;
            width: 370px;
            padding: 10px;
            cursor: pointer;
        }
        .second{
            flex: 1;
            padding: 30px;
            background: blue;
        }
        .pp{
            color: white;
            text-align: center;
        }
        .lol{
            padding-left: 30px;
        }
         .ppp{
            color: white;
            text-align: center;
            background: orange;
            padding: 7px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <form>
        <div class="why">
        <h1>Sign in</h1>
        <input type="email" placeholder="Email"><br><br>
        <input type="password" placeholder="Password">
        <p><a href="#">Forget Password</a></p>
        <button>Login</button>
        </div>
        <div class="second">
        <h1>Wecome Back!</h1>
        <p class="pp">Welcome back! We are so happy to have you here, It's Great to see you again. we hope you had a safe and enjoyable time away.</p>
        <p class="ppp">No Account Yet? <a href="sign.html">Signup.</a></p>
        </div>
        
    </form>
</body>
</html>
